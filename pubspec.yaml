name: boloebala
description: PWA Omnichannel para confeitaria Bolo & Bala
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  http: ^1.2.1
  google_fonts: ^6.2.1
  mask_text_input_formatter: ^2.5.0
  flutter_web_plugins:
    sdk: flutter
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  csv: ^8.0.0
  file_saver: ^0.4.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
